[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

# Function sources must not be downloadable from the site
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true
